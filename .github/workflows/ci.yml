name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Verify & static export
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Build static export
        run: npm run build

      - name: Verify export structure
        run: |
          test -f out/index.html
          test -f out/404.html
          test -f out/sitemap.xml
          test -f out/robots.txt

      - name: Upload out/ artifact
        uses: actions/upload-artifact@v4
        with:
          name: waymark-static-export
          path: out/
          if-no-files-found: error